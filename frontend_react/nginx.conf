server {
    listen 80 default_server;
    server_name attendancesystemuok.me www.attendancesystemuok.me;

    # Serve the React application
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is critical for React Router (Single Page Applications)
        # It redirects all 404s back to index.html so React can handle the URL
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.attendancesystemuok.me;

    # Reverse proxy to the Spring Boot backend container
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
